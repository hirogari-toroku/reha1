<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><style>
body{font:14px sans-serif;margin:20px;color:#222}label{display:block;margin:14px 0 6px}select,input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}input[type=checkbox]{width:auto}textarea{height:175px}button{margin-top:12px}#message{white-space:pre-wrap;color:#333}
</style></head><body>
<label for="user">利用者</label><select id="user"></select>
<label for="contact">公式LINEの受信者</label><select id="contact"></select>
<label for="login">予約確認を開いたLINE</label><select id="login"></select>
<label for="relation">続柄（本人・母・父・夫・妻など）</label><input id="relation" maxlength="30">
<label><input type="checkbox" id="confirmed">両方のLINEが同じ本人・家族のアカウントであることと、利用者との関係を確認しました</label>
<button id="create" disabled>確認したLINEを利用者に紐づける</button>
<p id="message" role="status">読み込み中...</p>
<script>
const el=id=>document.getElementById(id);
google.script.run.withSuccessHandler(data=>{
  for(const u of data.users) el('user').add(new Option(u.name,u.id));
  for(const c of data.contacts) el('contact').add(new Option(c.name+'：'+c.message,c.id));
  for(const l of data.logins) el('login').add(new Option(l.name+'（'+l.id.slice(-6)+'）',l.id));
  el('message').textContent=data.logins.length?'表示名だけで判断せず、公式LINEの相手と予約確認を開いた方が同一であることをご確認ください。リンク作成・メッセージ送信は行いません。':'確認待ちのログインはありません。利用者・家族に通常の「予定確認」を開いてもらってください。';
  el('create').disabled=!data.contacts.length||!data.logins.length;
}).withFailureHandler(()=>{el('message').textContent='一覧を取得できませんでした。開き直してください。';}).userLinkDialogOptions();
el('create').onclick=()=>{
  if(!el('confirmed').checked||!el('relation').value.trim()){el('message').textContent='続柄の入力と本人・家族の確認が必要です。';return;}
  if(!confirm('選択した利用者と2つのLINEの記録に間違いありませんか？ 確認後、このアカウントで利用者の予定を閲覧できます。'))return;
  el('create').disabled=true;el('message').textContent='登録中...';
  google.script.run.withSuccessHandler(data=>{
    el('message').textContent=data.message;
  }).withFailureHandler(error=>{el('message').textContent=error.message;el('create').disabled=false;}).userLinkConfirmAccount({userId:el('user').value,messagingId:el('contact').value,liffId:el('login').value,relation:el('relation').value,confirmed:true});
};
</script></body></html>
