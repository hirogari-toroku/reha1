<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f6f7f9;
      color: #1f2933;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.3;
    }

    .panel {
      background: #fff;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .staff {
      color: #1f2933;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    select,
    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 6px;
    }

    select,
    input,
    textarea {
      padding: 11px;
      border: 1px solid #c8d0d9;
      background: #fff;
      color: #1f2933;
    }

    option {
      color: #1f2933;
      background: #fff;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    .selected-dates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 34px;
      margin-top: 10px;
    }

    .schedule-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .schedule-card {
      border: 1px solid #dde3ea;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .schedule-card-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #1f2933;
      font-weight: 800;
      line-height: 1.4;
    }

    .schedule-card-meta {
      margin-top: 4px;
      color: #627386;
      font-size: 13px;
      line-height: 1.5;
    }

    .schedule-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .schedule-card-actions button {
      padding: 10px;
      border: 1px solid #c8d0d9;
      background: #fff;
      color: #1f2933;
      font-weight: 700;
    }

    .schedule-card-actions .danger {
      border-color: #f3b8b3;
      color: #b42318;
    }

    .schedule-edit {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .schedule-edit.hidden {
      display: none;
    }

    .date-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: auto;
      padding: 8px 10px;
      border: 1px solid #c8d0d9;
      border-radius: 6px;
      background: #fff;
      color: #1f2933;
      font-size: 14px;
      font-weight: 700;
    }

    .date-chip button {
      width: auto;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: #b42318;
      font-size: 16px;
      font-weight: 800;
    }

    .calendar {
      border: 1px solid #dde3ea;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .calendar-nav {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      border-bottom: 1px solid #dde3ea;
    }

    .calendar-nav button {
      height: 44px;
      border: 0;
      background: #fff;
      color: #06a949;
      font-size: 22px;
      font-weight: 800;
    }

    .calendar-title {
      text-align: center;
      font-weight: 800;
    }

    .weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekdays div {
      padding: 8px 0;
      background: #f6f7f9;
      color: #52606d;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .calendar-day {
      min-height: 44px;
      padding: 0;
      border: 0;
      border-top: 1px solid #edf1f5;
      border-right: 1px solid #edf1f5;
      background: #fff;
      color: #1f2933;
      font-weight: 700;
    }

    .calendar-day:nth-child(7n) {
      border-right: 0;
    }

    .calendar-day.empty {
      background: #f8fafc;
    }

    .calendar-day.selected {
      background: #06c755;
      color: #fff;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tabs button {
      padding: 10px;
      border: 1px solid #06c755;
      background: #fff;
      color: #06a949;
      font-weight: 700;
    }

    .tabs button.active {
      background: #06c755;
      color: #fff;
    }

    .type-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .type-buttons button {
      padding: 12px;
      border: 1px solid #c8d0d9;
      background: #fff;
      color: #1f2933;
      font-weight: 700;
    }

    .type-buttons button.active {
      border-color: #06c755;
      background: #e8f8ee;
      color: #047a33;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      width: auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #52606d;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-pill.active {
      background: #e8f8ee;
      color: #047a33;
    }

    .status-pill.done {
      background: #e7f0ff;
      color: #174ea6;
    }

    .status-pill.partial {
      background: #fff5d6;
      color: #a05a00;
    }

    .schedule-card-actions {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .schedule-card-actions .primary {
      border-color: #06c755;
      background: #06c755;
      color: #fff;
    }

    .schedule-card-actions button:disabled {
      border-color: #dde3ea;
      background: #f4f6f8;
      color: #a6b0ba;
    }

    .submit {
      margin-top: 18px;
      padding: 13px;
      border: 0;
      background: #06c755;
      color: #fff;
      font-weight: 800;
    }

    .submit:disabled {
      background: #a6b0ba;
    }

    .secondary {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #c8d0d9;
      background: #fff;
      color: #1f2933;
      font-weight: 800;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      color: #334e68;
      font-weight: 700;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>訪問予定</h1>

  <div class="panel">
    <div id="staff" class="staff">読み込み中...</div>

    <div class="tabs">
      <button id="manageTab" class="active" type="button" onclick="switchMode('manage')">予定一覧</button>
      <button id="scheduleTab" type="button" onclick="switchMode('schedule')">登録</button>
    </div>

    <div id="userPicker" class="hidden">
      <label for="userName">利用者</label>
      <select id="userName"></select>
    </div>

    <div id="visitForm" class="hidden">
      <label>種別</label>
      <div class="type-buttons">
        <button id="startButton" class="active" type="button" onclick="setVisitType('開始')">開始</button>
        <button id="endButton" type="button" onclick="setVisitType('終了')">終了</button>
      </div>

      <label for="visitDate">実施日</label>
      <input type="date" id="visitDate">

      <label for="visitTime">時刻</label>
      <input type="time" id="visitTime">

      <button id="visitSubmit" class="submit" type="button" onclick="recordVisit()">実績を登録</button>
    </div>

    <div id="scheduleForm" class="hidden">
      <label>訪問予定日</label>
      <div class="calendar">
        <div class="calendar-nav">
          <button type="button" onclick="moveScheduleMonth(-1)">‹</button>
          <div id="calendarTitle" class="calendar-title"></div>
          <button type="button" onclick="moveScheduleMonth(1)">›</button>
        </div>
        <div class="weekdays">
          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
        </div>
        <div id="calendarDays" class="calendar-days"></div>
      </div>
      <div id="selectedDates" class="selected-dates"></div>

      <button id="scheduleSubmit" class="submit" type="button" onclick="recordSchedule()">予定を登録</button>
    </div>

    <div id="manageForm">
      <button id="scheduleReload" class="secondary" type="button" onclick="loadSchedules()">予定を更新</button>
      <div id="scheduleList" class="schedule-list"></div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxCE2wBGAhY3vbYT0sGfyVhGYH36OvoxQyWAfR-ullAcqS90FQ2jCkm5G4SrLxyorwwqQ/exec";
    const LIFF_ID = "2010856600-yxOaV2Np";

    let lineUserId = "";
    let staffName = "";
    let visitType = "開始";
    let jsonpCounter = 0;
    let scheduleDates = [];
    let scheduleCalendarMonth = new Date();
    let visitSubmitting = false;
    let scheduleSubmitting = false;
    let scheduleActionSubmitting = false;
    let scheduleItems = [];
    let lastVisitKey = "";
    let lastVisitSentAt = 0;

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonp_cb_" + jsonpCounter++;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          delete window[callbackName];
          script.remove();
          reject(new Error("通信がタイムアウトしました。LIFF操作ログを確認してください。"));
        }, 20000);

        window[callbackName] = data => {
          clearTimeout(timer);
          resolve(data);
          delete window[callbackName];
          script.remove();
        };

        script.onerror = () => {
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
          reject(new Error("通信に失敗しました"));
        };

        script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + callbackName + "&_=" + Date.now();
        document.body.appendChild(script);
      });
    }

    function setMessage(text) {
      document.getElementById("message").innerText = text || "";
    }

    function setDisabled(disabled) {
      document.getElementById("visitSubmit").disabled = disabled;
      document.getElementById("scheduleSubmit").disabled = disabled;
      document.getElementById("scheduleReload").disabled = disabled;
    }

    function setToday() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mi = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("visitDate").value = yyyy + "-" + mm + "-" + dd;
      document.getElementById("visitTime").value = hh + ":" + mi;
      scheduleCalendarMonth = new Date(yyyy, now.getMonth(), 1);
    }

    function switchMode(mode) {
      const isVisit = mode === "visit";
      const isSchedule = mode === "schedule";
      const isManage = mode === "manage";

      document.getElementById("scheduleTab").classList.toggle("active", isSchedule);
      document.getElementById("manageTab").classList.toggle("active", isManage);
      document.getElementById("visitForm").classList.toggle("hidden", !isVisit);
      document.getElementById("scheduleForm").classList.toggle("hidden", !isSchedule);
      document.getElementById("manageForm").classList.toggle("hidden", !isManage);
      document.getElementById("userPicker").classList.toggle("hidden", !(isVisit || isSchedule));
      if (isSchedule) renderScheduleCalendar();
      if (isManage) loadSchedules();
      setMessage("");
    }

    function setVisitType(type) {
      visitType = type;
      document.getElementById("startButton").classList.toggle("active", type === "開始");
      document.getElementById("endButton").classList.toggle("active", type === "終了");
    }

    function formatScheduleDate(value) {
      const parts = String(value || "").split("-");
      if (parts.length !== 3) return "";

      const month = Number(parts[1]);
      const day = Number(parts[2]);
      if (!month || !day) return "";

      return month + "/" + day;
    }

    function toDateValue(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return yyyy + "-" + mm + "-" + dd;
    }

    function renderScheduleCalendar() {
      const year = scheduleCalendarMonth.getFullYear();
      const month = scheduleCalendarMonth.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const area = document.getElementById("calendarDays");

      document.getElementById("calendarTitle").innerText = year + "年" + (month + 1) + "月";
      area.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "calendar-day empty";
        area.appendChild(empty);
      }

      for (let day = 1; day <= lastDate; day++) {
        const value = toDateValue(new Date(year, month, day));
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        button.textContent = day;
        button.classList.toggle("selected", scheduleDates.includes(value));
        button.onclick = () => toggleScheduleDate(value);
        area.appendChild(button);
      }
    }

    function moveScheduleMonth(amount) {
      scheduleCalendarMonth = new Date(
        scheduleCalendarMonth.getFullYear(),
        scheduleCalendarMonth.getMonth() + amount,
        1
      );
      renderScheduleCalendar();
    }

    function renderScheduleDates() {
      const area = document.getElementById("selectedDates");
      area.innerHTML = "";

      scheduleDates.forEach(value => {
        const chip = document.createElement("span");
        chip.className = "date-chip";
        chip.textContent = formatScheduleDate(value);

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "×";
        removeButton.onclick = () => removeScheduleDate(value);

        chip.appendChild(removeButton);
        area.appendChild(chip);
      });
    }

    function toggleScheduleDate(value) {
      if (scheduleDates.includes(value)) {
        scheduleDates = scheduleDates.filter(date => date !== value);
      } else {
        scheduleDates.push(value);
        scheduleDates.sort();
      }

      renderScheduleCalendar();
      renderScheduleDates();
      setMessage("");
    }

    function removeScheduleDate(value) {
      scheduleDates = scheduleDates.filter(date => date !== value);
      renderScheduleCalendar();
      renderScheduleDates();
    }

    function getCurrentUserOptions() {
      return Array.from(document.getElementById("userName").options)
        .map(option => option.value)
        .filter(Boolean);
    }

    function loadSchedules(silent) {
      if (!lineUserId) return Promise.resolve();

      const params = new URLSearchParams({
        action: "getSchedules",
        lineUserId: lineUserId
      });

      document.getElementById("scheduleList").innerHTML = "";
      if (!silent) setMessage("予定を読み込み中...");

      return jsonp(GAS_URL + "?" + params.toString())
        .then(data => {
          if (!data.success) {
            scheduleItems = [];
            renderScheduleList();
            if (!silent) setMessage(data.message || "予定を取得できませんでした。");
            return;
          }

          scheduleItems = data.schedules || [];
          renderScheduleList();
          if (!silent) setMessage(scheduleItems.length ? "" : "対象期間内の予定はありません。");
        })
        .catch(error => {
          scheduleItems = [];
          renderScheduleList();
          if (!silent) setMessage("予定の取得に失敗しました：" + error.message);
        });
    }

    function renderScheduleList() {
      const area = document.getElementById("scheduleList");
      const users = getCurrentUserOptions();
      area.innerHTML = "";

      if (scheduleItems.length === 0) {
        const empty = document.createElement("div");
        empty.className = "schedule-card";
        empty.textContent = "対象期間内の予定はありません。";
        area.appendChild(empty);
        return;
      }

      scheduleItems.forEach(item => {
        const displayStatus = !item.status || item.status === "予定" ? "未開始" : item.status;
        const card = document.createElement("div");
        card.className = "schedule-card";

        const title = document.createElement("div");
        title.className = "schedule-card-title";

        const name = document.createElement("span");
        name.textContent = item.visitDate + "　" + item.userName;

        const status = document.createElement("span");
        status.className = "status-pill";
        status.textContent = displayStatus;
        if (displayStatus === "訪問中") status.classList.add("active");
        if (displayStatus === "完了") status.classList.add("done");
        if (displayStatus === "開始のみ") status.classList.add("partial");

        title.appendChild(name);
        title.appendChild(status);
        card.appendChild(title);

        if (item.lastVisitText || item.updatedAt) {
          const meta = document.createElement("div");
          meta.className = "schedule-card-meta";
          meta.textContent = item.lastVisitText || ("更新：" + item.updatedAt);
          card.appendChild(meta);
        }

        const actions = document.createElement("div");
        actions.className = "schedule-card-actions";

        const startButton = document.createElement("button");
        startButton.type = "button";
        startButton.className = "primary";
        startButton.textContent = "開始";
        startButton.disabled = scheduleActionSubmitting || displayStatus === "訪問中" || displayStatus === "完了";
        startButton.onclick = () => recordVisitForSchedule(item, "開始");

        const endButton = document.createElement("button");
        endButton.type = "button";
        endButton.className = "primary";
        endButton.textContent = "終了";
        endButton.disabled = scheduleActionSubmitting || displayStatus === "未開始" || displayStatus === "完了";
        endButton.onclick = () => recordVisitForSchedule(item, "終了");

        const editToggle = document.createElement("button");
        editToggle.type = "button";
        editToggle.textContent = "変更";
        editToggle.disabled = scheduleActionSubmitting;
        editToggle.onclick = () => toggleScheduleEdit(item.id);

        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "danger";
        cancelButton.textContent = "キャンセル";
        cancelButton.disabled = scheduleActionSubmitting;
        cancelButton.onclick = () => cancelSchedule(item.id, item.userName, item.visitDate);

        actions.appendChild(startButton);
        actions.appendChild(endButton);
        actions.appendChild(editToggle);
        actions.appendChild(cancelButton);
        card.appendChild(actions);

        const edit = document.createElement("div");
        edit.id = "scheduleEdit-" + item.id;
        edit.className = "schedule-edit hidden";

        const select = document.createElement("select");
        select.id = "scheduleUser-" + item.id;
        users.forEach(userName => {
          const option = document.createElement("option");
          option.value = userName;
          option.textContent = userName;
          option.selected = userName === item.userName;
          select.appendChild(option);
        });

        const input = document.createElement("input");
        input.id = "scheduleDate-" + item.id;
        input.type = "date";
        input.value = item.visitDateValue || "";

        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.className = "submit";
        saveButton.textContent = "変更を保存";
        saveButton.disabled = scheduleActionSubmitting;
        saveButton.onclick = () => updateSchedule(item.id);

        edit.appendChild(select);
        edit.appendChild(input);
        edit.appendChild(saveButton);
        card.appendChild(edit);

        area.appendChild(card);
      });
    }

    function currentTimeValue() {
      const now = new Date();
      return String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    }

    function isTodayValue(value) {
      const now = new Date();
      return value === [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
    }

    function askVisitTimeForSchedule(item, type) {
      const defaultTime = currentTimeValue();
      if (isTodayValue(item.visitDateValue)) return defaultTime;

      const entered = prompt(
        item.visitDate + " の" + type + "時刻を入力してください。\n例：18:04",
        defaultTime
      );
      if (entered === null) return "";

      const value = String(entered || "").trim();
      if (!/^\d{1,2}:\d{2}$/.test(value)) {
        setMessage("時刻は 18:04 のように入力してください。");
        return "";
      }

      return value;
    }

    function recordVisitForSchedule(item, type) {
      if (scheduleActionSubmitting || visitSubmitting) return;
      if (!item || !item.userName || !item.visitDateValue) {
        setMessage("予定の情報を確認できませんでした。画面を更新してください。");
        return;
      }

      const visitTime = askVisitTimeForSchedule(item, type);
      if (!visitTime) return;

      visitType = type === "終了" ? "終了" : "開始";
      document.getElementById("userName").value = item.userName;
      document.getElementById("visitDate").value = item.visitDateValue;
      document.getElementById("visitTime").value = visitTime;

      recordVisit(item.id);
    }

    function toggleScheduleEdit(scheduleId) {
      const edit = document.getElementById("scheduleEdit-" + scheduleId);
      if (!edit) return;
      edit.classList.toggle("hidden");
      setMessage("");
    }

    function cancelSchedule(scheduleId, userName, visitDate) {
      if (scheduleActionSubmitting) return;
      if (!confirm(userName + " 様の " + visitDate + " の予定をキャンセルしますか？")) return;

      const params = new URLSearchParams({
        action: "cancelSchedule",
        lineUserId: lineUserId,
        scheduleId: scheduleId
      });

      scheduleActionSubmitting = true;
      setDisabled(true);
      renderScheduleList();
      setMessage("キャンセル中...");

      jsonp(GAS_URL + "?" + params.toString())
        .then(data => {
          setMessage(data.message || "");
          return loadSchedules(true);
        })
        .catch(error => setMessage("キャンセルに失敗しました：" + error.message))
        .finally(() => {
          scheduleActionSubmitting = false;
          setTimeout(() => {
            setDisabled(false);
            renderScheduleList();
          }, 1200);
        });
    }

    function updateSchedule(scheduleId) {
      if (scheduleActionSubmitting) return;

      const userName = document.getElementById("scheduleUser-" + scheduleId).value;
      const visitDate = document.getElementById("scheduleDate-" + scheduleId).value;

      if (!userName || !visitDate) {
        setMessage("変更後の利用者と日付を選択してください。");
        return;
      }

      const params = new URLSearchParams({
        action: "updateSchedule",
        lineUserId: lineUserId,
        scheduleId: scheduleId,
        userName: userName,
        visitDate: visitDate
      });

      scheduleActionSubmitting = true;
      setDisabled(true);
      renderScheduleList();
      setMessage("変更中...");

      jsonp(GAS_URL + "?" + params.toString())
        .then(data => {
          setMessage(data.message || "");
          return loadSchedules(true);
        })
        .catch(error => setMessage("変更に失敗しました：" + error.message))
        .finally(() => {
          scheduleActionSubmitting = false;
          setTimeout(() => {
            setDisabled(false);
            renderScheduleList();
          }, 1200);
        });
    }

    function loadUsers() {
      const params = new URLSearchParams({
        action: "getUsers",
        lineUserId: lineUserId
      });

      return applyUserListData(jsonp(GAS_URL + "?" + params.toString()));
    }

    function applyUserListData(request) {
      return request.then(data => {
        const select = document.getElementById("userName");
        select.innerHTML = "";

        if (!data.success) {
          document.getElementById("staff").innerText =
            data.message + "\nLIFF用LINEユーザーID：" + lineUserId;
          setDisabled(true);
          return;
        }

        staffName = data.staffName;
        document.getElementById("staff").innerText = "スタッフ：" + staffName;

        data.users.forEach(user => {
          const userName = typeof user === "string" ? user : user.name;
          if (!userName) return;

          const option = document.createElement("option");
          option.value = userName;
          option.textContent = userName;
          select.appendChild(option);
        });

        if (data.users.length === 0) {
          setMessage("担当利用者が登録されていません。管理者へ確認してください。");
          setDisabled(true);
        }
      });
    }

    function initApp(displayName) {
      const params = new URLSearchParams({
        action: "init",
        lineUserId: lineUserId,
        displayName: displayName || ""
      });

      return applyUserListData(jsonp(GAS_URL + "?" + params.toString()))
        .catch(error => {
          document.getElementById("staff").innerText =
            "ログイン記録に失敗しました。\nLIFF用LINEユーザーID：" + lineUserId;
          setMessage("ログイン記録エラー：" + error.message);
          throw error;
        });
    }

    function logLogin(displayName) {
      const params = new URLSearchParams({
        action: "logLogin",
        lineUserId: lineUserId,
        displayName: displayName || ""
      });

      return jsonp(GAS_URL + "?" + params.toString())
        .then(data => {
          if (data && data.registered) {
            document.getElementById("staff").innerText = "スタッフ：" + data.staffName;
          } else {
            document.getElementById("staff").innerText =
              "ログイン記録済み。スタッフマスタへ下のIDを登録してください。\nLIFF用LINEユーザーID：" + lineUserId;
          }
          return data;
        })
        .catch(error => {
          document.getElementById("staff").innerText =
            "ログイン記録に失敗しました。\nLIFF用LINEユーザーID：" + lineUserId;
          setMessage("ログイン記録エラー：" + error.message);
          return null;
        });
    }

    function recordVisit(scheduleId) {
      const userName = document.getElementById("userName").value;
      const visitDate = document.getElementById("visitDate").value;
      const visitTime = document.getElementById("visitTime").value;
      const visitKey = [lineUserId, userName, visitType, visitDate, visitTime, scheduleId || ""].join("|");
      const now = Date.now();

      if (visitSubmitting) {
        setMessage("登録処理中です。少しお待ちください。");
        return;
      }

      if (visitKey === lastVisitKey && now - lastVisitSentAt < 10000) {
        setMessage("同じ内容をすでに送信しました。少し待ってから操作してください。");
        return;
      }

      const params = new URLSearchParams({
        action: "recordVisit",
        lineUserId: lineUserId,
        userName: userName,
        visitType: visitType,
        visitDate: visitDate,
        visitTime: visitTime
      });
      if (scheduleId) params.set("scheduleId", scheduleId);

      visitSubmitting = true;
      scheduleActionSubmitting = !!scheduleId;
      lastVisitKey = visitKey;
      lastVisitSentAt = now;
      setDisabled(true);
      renderScheduleList();
      setMessage("登録中...");

      jsonp(GAS_URL + "?" + params.toString())
        .then(data => {
          setMessage(data.message);
          if (scheduleId) return loadSchedules(true);
        })
        .catch(error => setMessage("登録に失敗しました：" + error.message))
        .finally(() => {
          visitSubmitting = false;
          scheduleActionSubmitting = false;
          setTimeout(() => {
            setDisabled(false);
            renderScheduleList();
          }, 1200);
        });
    }

    function recordSchedule() {
      if (scheduleSubmitting) {
        setMessage("登録処理中です。少しお待ちください。");
        return;
      }

      if (scheduleDates.length === 0) {
        setMessage("訪問予定日を1つ以上追加してください。");
        return;
      }

      const params = new URLSearchParams({
        action: "recordSchedule",
        lineUserId: lineUserId,
        userName: document.getElementById("userName").value,
        dates: scheduleDates.join(",")
      });

      scheduleSubmitting = true;
      setDisabled(true);
      setMessage("登録中...");

      jsonp(GAS_URL + "?" + params.toString())
        .then(data => {
          if (data.success) {
            scheduleDates = [];
            renderScheduleCalendar();
            renderScheduleDates();
          }
          setMessage(data.message);
        })
        .catch(error => setMessage("登録に失敗しました：" + error.message))
        .finally(() => {
          scheduleSubmitting = false;
          setTimeout(() => setDisabled(false), 1200);
        });
    }

    setToday();
    setDisabled(true);

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        return liff.getProfile();
      })
      .then(profile => {
        if (!profile) return;
        lineUserId = profile.userId;
        document.getElementById("staff").innerText =
          "スタッフ情報を確認中...\nLIFF用LINEユーザーID：" + lineUserId;
        return initApp(profile.displayName);
      })
      .then(() => loadSchedules(true))
      .then(() => setDisabled(false))
      .catch(error => {
        setDisabled(true);
        setMessage("LIFF初期化エラー：" + error.message);
      });
  </script>
</body>
</html>
