name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-gas:
    name: Deploy GAS
    runs-on: ubuntu-latest
    env:
      GAS_DEPLOYMENT_ID: AKfycbxCE2wBGAhY3vbYT0sGfyVhGYH36OvoxQyWAfR-ullAcqS90FQ2jCkm5G4SrLxyorwwqQ

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '${{ secrets.CLASP_JSON }}' > .clasp.json

      - name: Push Apps Script
        run: npx --yes @google/clasp push --force

      - name: Deploy Web App
        run: |
          VERSION_OUTPUT="$(npx --yes @google/clasp version "GitHub Actions ${GITHUB_SHA}")"
          echo "$VERSION_OUTPUT"
          VERSION_NUMBER="$(echo "$VERSION_OUTPUT" | grep -Eo '[0-9]+' | tail -1)"
          npx --yes @google/clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --versionNumber "$VERSION_NUMBER" --description "GitHub Actions ${GITHUB_SHA}"
